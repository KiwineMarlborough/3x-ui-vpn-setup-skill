# CDN fallback vhost — copy to /etc/nginx/sites-available/cdn-fallback and SYMLINK it:
#   ln -s /etc/nginx/sites-available/cdn-fallback /etc/nginx/sites-enabled/cdn-fallback
# (a copy instead of a symlink silently ignores later edits; never keep *.bak files in sites-enabled —
#  nginx includes every file there)
# Replace __CDN_DOMAIN__ before deploy. Certs: /etc/nginx/ssl/cdn/
#
# Port 80 MUST serve /.well-known/acme-challenge/ BEFORE redirecting: Let's Encrypt renewal
# (acme.sh webroot mode, scripts/deploy-acme-renewal.sh) validates through it. A server-level
# `return 301` would hide the location block, so the redirect lives inside `location /`.
# WEBROOT must match WEBROOT of deploy-acme-renewal.sh (default /var/www/cdn-fallback).

server {
    listen 80;
    listen [::]:80;
    server_name __CDN_DOMAIN__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cdn-fallback;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __CDN_DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/cdn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cdn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/cdn-fallback;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# Optional alt TLS on 10443 (some setups probe non-443 HTTPS)
server {
    listen 10443 ssl http2;
    listen [::]:10443 ssl http2;
    server_name __CDN_DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/cdn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cdn/privkey.pem;

    root /var/www/cdn-fallback;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
